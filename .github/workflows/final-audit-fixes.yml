name: Apply final audit fixes

on:
  push:
    branches: [chatgpt-audit-fixes]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply final audit fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-audit-fixes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, transforms):
              p = Path(path)
              s = p.read_text()
              original = s
              for name, fn in transforms:
                  before = s
                  s = fn(s)
                  if s == before:
                      print(f"WARNING: no change for {path}: {name}")
                  else:
                      print(f"changed {path}: {name}")
              if s != original:
                  p.write_text(s)

          # 1) Persist the selected pen profile in every stroke.
          edit('src/components/videoink/ObjectCanvas.tsx', [
              ('stroke profile', lambda s: s.replace(
                  'tool: highlighter ? "highlighter" : "pen",\n      color:',
                  'tool: highlighter ? "highlighter" : "pen",\n      profile: highlighter ? "highlighter" : prefs.penProfile,\n      color:', 1)),
          ])

          # 2) Add an explicit profile field to Stroke if it is absent.
          edit('src/lib/videoink/types.ts', [
              ('Stroke profile type', lambda s: re.sub(
                  r'(export interface Stroke \{\n(?:.|\n)*?\n  tool: ToolId;\n)',
                  lambda m: m.group(1) + '  profile?: import("./prefs").PenProfileId;\n' if 'profile?:' not in m.group(0) else m.group(0),
                  s, count=1)),
          ])

          # 3) Improve profile fidelity: use the active profile parameters when creating ink.
          edit('src/components/videoink/ObjectCanvas.tsx', [
              ('profile parameters', lambda s: s.replace(
                  '  const highlighter = tool === "highlighter";\n  const base = highlighter ? prefs.highlighterSize : prefs.penSize;\n',
                  '  const highlighter = tool === "highlighter";\n  const profile = highlighter ? undefined : PEN_PROFILES[prefs.penProfile];\n  const base = highlighter ? prefs.highlighterSize : prefs.penSize * (profile?.widthScale ?? 1);\n', 1)),
              ('profile opacity and thinning', lambda s: s.replace(
                  '    opacity: highlighter ? prefs.highlighterOpacity : 1,\n      size: Math.max(0.0008, base),\n',
                  '    opacity: highlighter ? prefs.highlighterOpacity : (profile?.opacity ?? 1),\n      size: Math.max(0.0008, base),\n', 1).replace(
                  '    thinning: highlighter ? 0 : pressureThinning(prefs.pressure),\n      smoothing: 0.45 + 0.4 * prefs.smoothing,\n',
                  '    thinning: highlighter ? 0 : Math.max(0, Math.min(0.95, profile?.thinning ?? pressureThinning(prefs.pressure))),\n      smoothing: highlighter ? prefs.smoothing : Math.max(prefs.smoothing, profile?.smoothing ?? prefs.smoothing),\n', 1)),
          ])

          # 4) Make blank pages a first-class, immediately editable workspace with debounced autosave.
          route = Path('src/routes/index.tsx')
          s = route.read_text()
          marker = '  /* --------------------------- source ----------------------------- */\n'
          autosave = '''  /* ---------------------- blank-page autosave ---------------------- */\n  useEffect(() => {\n    if (!annotating || activePage?.type !== "blank") return;\n    const timer = window.setTimeout(async () => {\n      const next: Page = {\n        ...activePage,\n        objects: editor.objects,\n        updatedAt: Date.now(),\n      };\n      next.thumbnail = await makeThumbnail(next);\n      await putPage(next);\n      setPages(await listPages());\n      setActivePage(next);\n    }, 500);\n    return () => window.clearTimeout(timer);\n  }, [annotating, activePage, editor.objects]);\n\n'''
          if 'blank-page autosave' not in s:
              s = s.replace(marker, autosave + marker, 1)
          # Make blank page creation immediately editable and reset video state visually.
          if 'const isBlankWorkspace = activePage?.type === "blank" && annotating;' not in s:
              s = s.replace('  const editingText = useMemo(', '  const isBlankWorkspace = activePage?.type === "blank" && annotating;\n\n  const editingText = useMemo(', 1)
          s = s.replace(
              '            <Player\n              ref={playerRef}',
              '            {!isBlankWorkspace && <Player\n              ref={playerRef}', 1)
          s = s.replace(
              '              onError={(message) => toast.error(message)}\n            />\n\n            <ObjectCanvas',
              '              onError={(message) => toast.error(message)}\n            />}\n            {isBlankWorkspace && (\n              <div className="absolute inset-0 bg-background" aria-label="Blank note page" />\n            )}\n\n            <ObjectCanvas', 1)
          s = s.replace(
              '          {source && (\n            <div className="border-t border-border/70 p-2">',
              '          {source && !isBlankWorkspace && (\n            <div className="border-t border-border/70 p-2">', 1)
          route.write_text(s)

          # 5) Add the shape UX callback to the canvas and automatically return to Move after creation.
          edit('src/components/videoink/ObjectCanvas.tsx', [
              ('tool change prop', lambda s: s.replace(
                  '  onRecognized?: (label: string) => void;\n}',
                  '  onRecognized?: (label: string) => void;\n  onToolChange?: (tool: ToolId) => void;\n}', 1).replace(
                  '  onRecognized,\n}: Props)',
                  '  onRecognized,\n  onToolChange,\n}: Props)', 1)),
              ('shape auto move', lambda s: s.replace(
                  '      if (dist > 0.008) editor.add(makeShape(d.a, d.b, tool, prefs, 0));',
                  '      if (dist > 0.008) {\n        const shape = makeShape(d.a, d.b, tool, prefs, 0);\n        editor.add(shape);\n        editor.setSelection([shape.id]);\n        onToolChange?.("move");\n      }', 1).replace(
                  '          editor.add(makeShapeFrom(rec.shape, rec.a, rec.b, prefs, stroke.color, stroke.size));\n          onRecognized?.(rec.shape);',
                  '          const shape = makeShapeFrom(rec.shape, rec.a, rec.b, prefs, stroke.color, stroke.size);\n          editor.add(shape);\n          editor.setSelection([shape.id]);\n          onToolChange?.("move");\n          onRecognized?.(rec.shape);', 1)),
          ])

          # 6) Route callback into ObjectCanvas.
          edit('src/routes/index.tsx', [
              ('canvas tool callback', lambda s: s.replace(
                  '              onRecognized={flashLabel}\n            />',
                  '              onRecognized={flashLabel}\n              onToolChange={setTool}\n            />', 1)),
          ])

          # 7) Add a persisted shape-tool visibility preference without changing stored objects.
          edit('src/lib/videoink/prefs.ts', [
              ('shape visibility preference', lambda s: s.replace(
                  '  penProfile: PenProfileId;\n',
                  '  penProfile: PenProfileId;\n  shapeToolsVisible: boolean;\n', 1).replace(
                  '  penProfile: "ballpoint",\n',
                  '  penProfile: "ballpoint",\n  shapeToolsVisible: true,\n', 1)),
          ])

          # 8) Make direct video capture explicit in documentation/code contracts.
          capture = Path('src/lib/videoink/capture.ts')
          cs = capture.read_text()
          if 'requestVideoFrameCallback' not in cs:
              cs = cs.replace(
                  'export interface CaptureOptions {',
                  'export interface CaptureOptions {\n  /** Prefer decoded HTMLVideoElement pixels when same-origin/CORS permits. */\n  preferDirectVideoFrame?: boolean;\n', 1)
              )
              capture.write_text(cs)

      - name: Install and build
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || git commit -m "chore: apply final audit fixes"
          git push origin chatgpt-audit-fixes
