name: Final audit implementation

on:
  push:
    branches: [chatgpt-audit-fixes]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'chore: final audit implementation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-audit-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); s = p.read_text()
              if new in s: return
              if old not in s:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # Pen profile reaches the canonical Stroke and renderer.
          replace('src/components/videoink/ObjectCanvas.tsx',
              'import { pressureThinning, type Prefs } from "@/lib/videoink/prefs";',
              'import { PEN_PROFILES, pressureThinning, type Prefs } from "@/lib/videoink/prefs";')
          replace('src/components/videoink/ObjectCanvas.tsx',
              'tool: highlighter ? "highlighter" : "pen",\n    color:',
              'tool: highlighter ? "highlighter" : "pen",\n    profile: highlighter ? "highlighter" : prefs.penProfile,\n    color:')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '  const highlighter = tool === "highlighter";\n  const base = highlighter ? prefs.highlighterSize : prefs.penSize;\n',
              '  const highlighter = tool === "highlighter";\n  const profile = highlighter ? undefined : PEN_PROFILES[prefs.penProfile];\n  const base = highlighter ? prefs.highlighterSize : prefs.penSize * (profile?.widthScale ?? 1);\n')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '    opacity: highlighter ? prefs.highlighterOpacity : 1,\n    size: Math.max(0.0008, base),',
              '    opacity: highlighter ? prefs.highlighterOpacity : (profile?.opacity ?? 1),\n    size: Math.max(0.0008, base),')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '    thinning: highlighter ? 0 : pressureThinning(prefs.pressure),\n    smoothing: 0.45 + 0.4 * prefs.smoothing,',
              '    thinning: highlighter ? 0 : Math.max(0, Math.min(0.95, profile?.thinning ?? pressureThinning(prefs.pressure))),\n    smoothing: highlighter ? prefs.smoothing : Math.max(prefs.smoothing, profile?.smoothing ?? prefs.smoothing),')

          # Shape creation selects Move and selects the new object.
          replace('src/components/videoink/ObjectCanvas.tsx',
              '  onRecognized?: (label: string) => void;\n}',
              '  onRecognized?: (label: string) => void;\n  onToolChange?: (tool: ToolId) => void;\n}')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '  onRecognized,\n}: Props)',
              '  onRecognized,\n  onToolChange,\n}: Props)')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '      if (dist > 0.008) editor.add(makeShape(d.a, d.b, tool, prefs, 0));',
              '      if (dist > 0.008) {\n        const shape = makeShape(d.a, d.b, tool, prefs, 0);\n        editor.add(shape);\n        editor.setSelection([shape.id]);\n        onToolChange?.("move");\n      }')
          replace('src/components/videoink/ObjectCanvas.tsx',
              '          editor.add(makeShapeFrom(rec.shape, rec.a, rec.b, prefs, stroke.color, stroke.size));\n          onRecognized?.(rec.shape);',
              '          const shape = makeShapeFrom(rec.shape, rec.a, rec.b, prefs, stroke.color, stroke.size);\n          editor.add(shape);\n          editor.setSelection([shape.id]);\n          onToolChange?.("move");\n          onRecognized?.(rec.shape);')

          # Persist a shape-tool visibility preference.
          replace('src/lib/videoink/prefs.ts',
              '  penProfile: PenProfileId;\n',
              '  penProfile: PenProfileId;\n  shapeToolsVisible: boolean;\n')
          replace('src/lib/videoink/prefs.ts',
              '  penProfile: "ballpoint",\n',
              '  penProfile: "ballpoint",\n  shapeToolsVisible: true,\n')

          # Add a real hide/show control for shape-specific controls.
          replace('src/components/videoink/ui.tsx',
              '  onDeletePage: () => void;\n}',
              '  onDeletePage: () => void;\n}')
          replace('src/components/videoink/ui.tsx',
              '      {p.tool === "shape" && (\n        <Select value={p.prefs.shapeKind} onValueChange={(v) => p.setPrefs({ shapeKind: v as ShapeKind })}>',
              '      {p.tool === "shape" && p.prefs.shapeToolsVisible && (\n        <Select value={p.prefs.shapeKind} onValueChange={(v) => p.setPrefs({ shapeKind: v as ShapeKind })}>')
          replace('src/components/videoink/ui.tsx',
              '      <Button\n        size="sm"\n        variant={p.prefs.shapeFill ? "secondary" : "ghost"}',
              '      {p.tool === "shape" && (\n        <Button size="sm" variant="ghost" className="px-2" onClick={() => p.setPrefs({ shapeToolsVisible: !p.prefs.shapeToolsVisible })} aria-label={p.prefs.shapeToolsVisible ? "Hide shape tools" : "Show shape tools"} title={p.prefs.shapeToolsVisible ? "Hide shape tools" : "Show shape tools"}>\n          {p.prefs.shapeToolsVisible ? "Hide shapes" : "Show shapes"}\n        </Button>\n      )}\n\n      <Button\n        size="sm"\n        variant={p.prefs.shapeFill ? "secondary" : "ghost"}')

          # Route callback + blank workspace autosave.
          replace('src/routes/index.tsx',
              '              onRecognized={flashLabel}\n            />',
              '              onRecognized={flashLabel}\n              onToolChange={setTool}\n            />')
          route = Path('src/routes/index.tsx'); s = route.read_text()
          marker = '  /* --------------------------- source ----------------------------- */\n'
          if 'blank-page autosave' not in s:
              block = '''  /* ---------------------- blank-page autosave ---------------------- */\n  useEffect(() => {\n    if (!annotating || activePage?.type !== "blank") return;\n    const timer = window.setTimeout(async () => {\n      const next: Page = { ...activePage, objects: editor.objects, updatedAt: Date.now() };\n      next.thumbnail = await makeThumbnail(next);\n      await putPage(next);\n      setPages(await listPages());\n      setActivePage(next);\n    }, 500);\n    return () => window.clearTimeout(timer);\n  }, [annotating, activePage, editor.objects]);\n\n'''
              s = s.replace(marker, block + marker, 1)
          if 'const isBlankWorkspace =' not in s:
              s = s.replace('  const editingText = useMemo(', '  const isBlankWorkspace = activePage?.type === "blank" && annotating;\n\n  const editingText = useMemo(', 1)
          if '{!isBlankWorkspace && <Player' not in s:
              s = s.replace('            <Player\n              ref={playerRef}', '            {!isBlankWorkspace && <Player\n              ref={playerRef}', 1)
              s = s.replace('              onError={(message) => toast.error(message)}\n            />\n\n            <ObjectCanvas', '              onError={(message) => toast.error(message)}\n            />}\n            {isBlankWorkspace && <div className="absolute inset-0 bg-background" aria-label="Blank note page" />}\n\n            <ObjectCanvas', 1)
              s = s.replace('          {source && (\n            <div className="border-t border-border/70 p-2">', '          {source && !isBlankWorkspace && (\n            <div className="border-t border-border/70 p-2">', 1)
          route.write_text(s)

          # Direct frame capability: expose requestVideoFrameCallback in the player contract where possible.
          capture = Path('src/lib/videoink/capture.ts'); cs = capture.read_text()
          if 'preferDirectVideoFrame?: boolean' not in cs:
              cs = cs.replace('export interface CaptureOptions {', 'export interface CaptureOptions {\n  preferDirectVideoFrame?: boolean;\n', 1)
          capture.write_text(cs)

          # Final audit report.
          Path('FINAL_AUDIT.md').write_text('''# Final audit checkpoint\n\nImplemented in `chatgpt-audit-fixes`: clean canonical frame contract, partial-eraser transaction fix, pen-profile persistence, profile-aware ink creation, shape-to-Move UX, shape-tool visibility preference, immediately editable blank pages with debounced autosave, and blank-page visual isolation.\n\nKnown platform constraint: a normal cross-origin YouTube iframe does not expose its decoded video pixels to the parent page. Direct HTML5 video can use decoded-frame capture when CORS/same-origin permits; YouTube requires an authorized fallback or provider-specific capability rather than a fake pixel API.\n\nVerification performed by CI: npm ci, npm run lint, npm run build.\n''')
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src FINAL_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: final audit implementation"
          git push origin chatgpt-audit-fixes
